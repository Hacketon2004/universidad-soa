spring.application.name=servicio-estudiante
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/universidad_estudiantes}
spring.datasource.username=${DB_USERNAME:svc_estudiantes}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Direccion del servicio de autenticacion (usada por JwtEstudianteFilter)
auth.url=${AUTH_URL:http://localhost:8081}
