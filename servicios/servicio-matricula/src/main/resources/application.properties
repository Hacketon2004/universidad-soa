spring.application.name=servicio-matricula

server.port=${PORT:8085}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/universidad_matriculas}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

auth.url=${AUTH_URL:http://localhost:8081}


# Integracion con otros servicios (llamadas directas, sin pasar por el gateway)
estudiante.url=${ESTUDIANTE_URL:http://localhost:8082}
curso.url=${CURSO_URL:http://localhost:8083}

# Interruptores: permiten desplegar matricula aunque un servicio aun no este en el servidor
integracion.estudiantes.activa=${INTEGRACION_ESTUDIANTES:true}
integracion.cursos.activa=${INTEGRACION_CURSOS:true}
