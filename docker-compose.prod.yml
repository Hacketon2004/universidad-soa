services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: universidad_matriculas
      MYSQL_USER: svc_matriculas
      MYSQL_PASSWORD: ${DB_MATRICULA_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Crea las BD y usuarios de estudiantes y cursos (si no existen) y termina.
  mysql-init:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      DB_ESTUDIANTE_PASSWORD: ${DB_ESTUDIANTE_PASSWORD}
      DB_CURSO_PASSWORD: ${DB_CURSO_PASSWORD}
    volumes:
      - ./bd/mysql/prod/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      mysql:
        condition: service_healthy
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  servicio-autenticacion:
    build: ./servicios/servicio-autenticacion
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/universidad_auth
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_INICIAL_HABILITADO: "true"
      ADMIN_INICIAL_CORREO: ${ADMIN_INICIAL_CORREO}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      - mongo

  servicio-matricula:
    build: ./servicios/servicio-matricula
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/universidad_matriculas
      DB_USERNAME: svc_matriculas
      DB_PASSWORD: ${DB_MATRICULA_PASSWORD}
      AUTH_URL: http://servicio-autenticacion:8081
      ESTUDIANTE_URL: http://servicio-estudiante:8082
      CURSO_URL: http://servicio-curso:8083
      # Cambiar a "true" cuando estudiantes y cursos esten desplegados en el servidor
      INTEGRACION_ESTUDIANTES: "true"
      INTEGRACION_CURSOS: "true"
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      mysql:
        condition: service_healthy
      servicio-autenticacion:
        condition: service_started

  servicio-estudiante:
    build: ./servicios/servicio-estudiante
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/universidad_estudiantes
      DB_USERNAME: svc_estudiantes
      DB_PASSWORD: ${DB_ESTUDIANTE_PASSWORD}
      AUTH_URL: http://servicio-autenticacion:8081
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      servicio-autenticacion:
        condition: service_started

  servicio-curso:
    build: ./servicios/servicio-curso
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/universidad_cursos
      DB_USERNAME: svc_cursos
      DB_PASSWORD: ${DB_CURSO_PASSWORD}
      AUTH_SERVICE_URL: http://servicio-autenticacion:8081
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      servicio-autenticacion:
        condition: service_started

  servicio-financiero:
    build: ./servicios/servicio-financiero
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/universidad_financiero
      AUTH_URL: http://servicio-autenticacion:8081
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      - mongo
      - servicio-autenticacion

  api-gateway:
    build: ./infra/api-gateway
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      AUTH_URL: http://servicio-autenticacion:8081
      MATRICULA_URL: http://servicio-matricula:8085
      CURSO_URL: http://servicio-curso:8083
      ESTUDIANTE_URL: http://servicio-estudiante:8082
      FINANZAS_URL: http://servicio-financiero:8084
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      - servicio-autenticacion
      - servicio-matricula

volumes:
  mysql_data:
  mongo_data:
