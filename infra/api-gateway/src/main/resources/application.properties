
spring.application.name=api-gateway
server.port=8080

# AUTENTICACION
spring.cloud.gateway.server.webmvc.routes[0].id=servicio-autenticacion
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# ESTUDIANTES
spring.cloud.gateway.server.webmvc.routes[1].id=servicio-estudiante
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
