spring.application.name=api-gateway
server.port=${PORT:8080}

# Direccion del servicio de autenticacion (usada por JwtGatewayFilter)
auth.url=${AUTH_URL:http://localhost:8081}

# AUTENTICACION
spring.cloud.gateway.server.webmvc.routes[0].id=servicio-autenticacion
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# ESTUDIANTES
spring.cloud.gateway.server.webmvc.routes[1].id=servicio-estudiante
spring.cloud.gateway.server.webmvc.routes[1].uri=${ESTUDIANTE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/estudiantes/**

# CURSOS
spring.cloud.gateway.server.webmvc.routes[2].id=servicio-curso
spring.cloud.gateway.server.webmvc.routes[2].uri=${CURSO_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/cursos/**

# FINANCIERO
spring.cloud.gateway.server.webmvc.routes[3].id=servicio-financiero
spring.cloud.gateway.server.webmvc.routes[3].uri=${FINANZAS_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/finanzas/**

# MATRICULA
spring.cloud.gateway.server.webmvc.routes[4].id=servicio-matricula
spring.cloud.gateway.server.webmvc.routes[4].uri=${MATRICULA_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/matriculas,/api/matriculas/**

# GESTION DE USUARIOS (vive en el servicio de autenticacion)
spring.cloud.gateway.server.webmvc.routes[5].id=gestion-usuarios
spring.cloud.gateway.server.webmvc.routes[5].uri=${AUTH_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/usuarios,/api/usuarios/**
