name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio:
          - servicios/servicio-autenticacion
          - servicios/servicio-estudiante
          - servicios/servicio-curso
          - servicios/servicio-financiero
          - servicios/servicio-matricula
          - infra/api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml

      - name: Compilar y ejecutar pruebas unitarias
        run: mvn -B package -Dtest='*Test' -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/universidad-web
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/universidad-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  ci-ok:
    name: CI completo
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verificar que todo paso
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Alguna verificacion fallo: no se puede juntar a main"
            exit 1
          fi
          echo "Todo en verde"
